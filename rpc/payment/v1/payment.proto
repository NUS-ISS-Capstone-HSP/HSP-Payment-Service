syntax = "proto3";

package payment.v1;

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_COMPLETED = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_REFUNDED = 4;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_WECHAT = 1;
  PAYMENT_METHOD_CASH = 2;
}

message Payment {
  string payment_id = 1;
  string order_id = 2;
  double amount = 3;
  PaymentMethod method = 4;
  PaymentStatus status = 5;
  string paid_at = 6;
  string created_at = 7;
  string updated_at = 8;
}

message WorkerIncome {
  string income_id = 1;
  string order_id = 2;
  string worker_id = 3;
  double order_amount = 4;
  double commission_rate = 5;
  double worker_amount = 6;
  string settled = 7;
  string settled_at = 8;
  string created_at = 9;
}

message CreatePaymentRequest {
  string order_id = 1;
  double amount = 2;
  PaymentMethod method = 3;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string order_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message ProcessPaymentCallbackRequest {
  string payment_id = 1;
  bool success = 2;
}

message ProcessPaymentCallbackResponse {
  Payment payment = 1;
}

message CalculateWorkerIncomeRequest {
  string order_id = 1;
  string worker_id = 2;
  double order_amount = 3;
}

message CalculateWorkerIncomeResponse {
  WorkerIncome income = 1;
}

message GetRevenueSummaryRequest {
  string start_date = 1;
  string end_date = 2;
}

message RevenueSummary {
  double total_revenue = 1;
  double total_worker_payout = 2;
  double net_income = 3;
  int32 total_orders = 4;
  int32 paid_orders = 5;
}

message GetRevenueSummaryResponse {
  RevenueSummary summary = 1;
  repeated WorkerIncome incomes = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ProcessPaymentCallback(ProcessPaymentCallbackRequest) returns (ProcessPaymentCallbackResponse);
  rpc CalculateWorkerIncome(CalculateWorkerIncomeRequest) returns (CalculateWorkerIncomeResponse);
  rpc GetRevenueSummary(GetRevenueSummaryRequest) returns (GetRevenueSummaryResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
